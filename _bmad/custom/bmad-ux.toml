# Team override: use central TOML config merge for identity/language.
# Stock SKILL.md still mentions bmm/config.yaml — ignore that for these keys.

[workflow]
activation_steps_prepend = [
  "CONFIG OVERRIDE: Do not load user_name or communication_language from `_bmad/bmm/config.yaml`. Run `uv run {project-root}/_bmad/scripts/resolve_config.py --project-root {project-root}` (merges `_bmad/config.toml`, `_bmad/config.user.toml`, `_bmad/custom/config.toml`, `_bmad/custom/config.user.toml`). From the JSON take user_name, communication_language, document_output_language, project_name, output_folder from `core`; planning_artifacts from `modules.bmm`; date from system datetime. Prefer these values over any later yaml-based config step. If the script is blocked or fails: do NOT fall back to module config.yaml or to English by default. Manually read the four TOML layers in merge order (later wins): `_bmad/config.toml`, `_bmad/config.user.toml`, `_bmad/custom/config.toml`, `_bmad/custom/config.user.toml` — take user_name and communication_language from the merged [core]. Only if those files are unreadable, address the user neutrally without inventing a name or language.",
]
persistent_facts = [
  "Identity and communication language always come from resolve_config.py four-layer merge (including `_bmad/custom/config.user.toml`), never from module config.yaml alone.",
]

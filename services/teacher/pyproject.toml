[project]
name = "teacher-service"
version = "0.1.0"
description = "Hexagonal Python teacher service for ai-language-teacher"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "fastapi==0.141.1",
    "langgraph==1.2.12",
    "langchain-core==1.6.4",
    "uvicorn==0.53.0",
]

[project.scripts]
teacher-api = "teacher_service.adapters.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
